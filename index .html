:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}

#app{display:flex;height:100%}
#cv{flex:1;position:relative;min-width:0;min-height:0;touch-action:none}

#vn{position:absolute;left:10px;top:8px;background:#fffc;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;pointer-events:none}
#pn{width:300px;overflow:auto;padding:12px;background:#fff;border-left:1px solid #ddd;font-size:13px}
#pn h3{margin:12px 0 5px;font-size:12px;color:#2e7d32;letter-spacing:.5px}
.vb{display:grid;grid-template-columns:1fr 1fr;gap:5px}
button{padding:8px 4px;border:1px solid #bbb;background:#f7f7f7;border-radius:8px;font:inherit;font-size:12px}
button.on{background:#2e7d32;color:#fff;border-color:#2e7d32}
label{display:block;padding:3px 0}
input[type=range]{width:100%}
.ok{background:#e6f6ea;color:#1b7a1b;border-radius:6px;padding:5px 8px;margin-top:8px}
.bad{background:#fde8e8;color:#b00}
small{color:#666}
@media(max-width:760px){#app{flex-direction:column}#pn{width:auto;max-height:44%;border-left:0;border-top:1px solid #ddd}}
